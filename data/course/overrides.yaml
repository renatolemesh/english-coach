# Correções à mão das traduções do banco de palavras (data/course/words.jsonl).
#
# O scripts/build-course.ts escolhe a tradução de cada palavra por estatística (Wiktionary +
# Tatoeba) e aplica este arquivo por cima; o build falha se um id daqui não existir no CEFR-J.
# Formato: id da palavra (como em words.jsonl) -> um destes:
#   {gloss: tradução, alt: [outras]}  tradução principal e a lista inteira de alternativas
#                                    (sem alt, ficam as calculadas; alt: [] esvazia a lista)
#   {alt: [outras]}                  só troca as alternativas
#   {drop: motivo}                   a palavra sai do banco (continua contando para o nível)
# A tradução aparece como o significado da palavra e é a resposta certa da múltipla escolha; as
# erradas são traduções de outras palavras. Português do Brasil, forma de dicionário (masculino
# singular, verbo no infinitivo), o sentido mais comum para a classe gramatical do id.

# Wiktionary só tem o grau em latim ("artium magister")
a.m..adv: {gloss: da manhã, alt: [de manhã, manhã]}
p.m..adv: {gloss: da tarde, alt: [da noite, tarde, noite]}
# o Tatoeba espalha por uma dúzia de verbos; nenhum chega ao limite de confiança
get.v: {gloss: conseguir, alt: [obter, pegar, receber, ficar]}
turn.v: {gloss: virar, alt: [girar, transformar, ficar]}
away.adv: {gloss: longe, alt: [embora, fora, distante]}
back.adv: {gloss: de volta, alt: [para trás, atrás, voltar]}
up.prep: {gloss: para cima, alt: [em cima, acima]}
around.prep: {gloss: ao redor de, alt: [em volta de, por volta de, em torno de, perto de]}
# "que" e "o que" estão em toda parte, a taxa de base os esconde
what.pron: {gloss: o que, alt: [que, qual]}
anything.pron: {gloss: alguma coisa, alt: [algo, qualquer coisa, nada]}
those.det: {gloss: aqueles, alt: [aquelas, esses, essas]}
# "seu" também é "your": dele/dela/deles é o que o aluno consegue associar
his.det: {gloss: dele, alt: [seu, sua]}
her.det: {gloss: dela, alt: [seu, sua]}
their.det: {gloss: deles, alt: [delas, seu, sua]}
hers.pron: {gloss: dela, alt: [seu, sua]}
# sem verbete no Wiktionary
all_right.adj: {gloss: tudo bem, alt: [bem, certo, ok]}
all_right.adv: {gloss: tudo bem, alt: [bem, certo, ok]}
sure.adj: {gloss: certo, alt: [seguro, com certeza, certeza]}
# o Tatoeba escreve mais "TV"; a palavra é o que o aluno precisa
TV.n: {gloss: televisão, alt: [TV, tevê]}
CV.n: {gloss: currículo, alt: [CV]}
# o Wiktionary oferece "vegetal"/"hortaliça"; no Brasil se diz "legume" ou "verdura"
vegetable.n: {gloss: legume, alt: [verdura, vegetal, hortaliça]}
# "a lot" é "muito"; o Wiktionary só tem lot = "lote", "destino"
lot.pron: {gloss: muito, alt: [bastante, muitos, vários]}
lot.adv: {gloss: muito, alt: [bastante]}
# o Tatoeba é cheio de "a few" (alguns); "few" sozinho é "poucos"
few.det: {gloss: poucos, alt: [alguns, pouco]}
else.adv: {gloss: mais, alt: [outro, outra coisa, de outro modo]}
o'clock.adv: {gloss: em ponto, alt: [hora, horas]}
# o português omite "it" ou usa o/a; ele/ela sozinhos pareceriam "he/she"
it.pron: {gloss: isso, alt: [ele, ela, o, a]}
# o CEFR-J lista como substantivo e adjetivo; em português são interjeições
hello.n: {gloss: olá, alt: [oi, alô]}
sorry.adj: {gloss: desculpe, alt: [desculpa, sinto muito, arrependido, com pena]}
most.det: {gloss: a maioria, alt: [maioria, mais, maior parte]}
than.prep: {gloss: do que, alt: [que, de]}
than.conj: {gloss: do que, alt: [que, de]}
each_other.pron: {gloss: um ao outro, alt: [uns aos outros, se]}
yourself.pron: {gloss: você mesmo, alt: [se, si mesmo, você]}

