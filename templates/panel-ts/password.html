{% extends "base.html" %}
{% from "macros.html" import csrf_field %}
{% block title %}Senha{% endblock %}
{% block content %}
<section class="narrow card">
  <h1>Trocar senha</h1>
  {% if session.admin.mustChangePassword %}<p class="note">Defina uma senha sua para continuar.</p>{% endif %}
  <form method="post" action="/panel/admin/password">
    {{ csrf_field(csrf) }}
    <label>Senha atual<input name="current" type="password" autocomplete="current-password" required></label>
    <label>Nova senha<input name="password" type="password" minlength="8" autocomplete="new-password" required></label>
    <label>Repita<input name="password2" type="password" minlength="8" autocomplete="new-password" required></label>
    <button>Salvar</button>
  </form>
</section>
{% endblock %}
